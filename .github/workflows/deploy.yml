name: Site Deploy

on:
  release:
    types: [created]

# Sets permissions of the GITHUB_TOKEN to allow updating projects.yaml, publishing artifacts, and deploying to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Update data/projects.yaml from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_projects.py
      - name: Commit and push updated data/projects.yaml
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "${DEFAULT_BRANCH}"
          if ! git diff --quiet "origin/${DEFAULT_BRANCH}" -- data/projects.yaml; then
            cp data/projects.yaml "${RUNNER_TEMP}/projects.yaml"
            CURRENT_HEAD=$(git rev-parse HEAD)
            git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"
            cp "${RUNNER_TEMP}/projects.yaml" data/projects.yaml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/projects.yaml
            git commit -m "chore: update data/projects.yaml"
            git push origin "${DEFAULT_BRANCH}"
            git checkout "${CURRENT_HEAD}"
            cp "${RUNNER_TEMP}/projects.yaml" data/projects.yaml
          else
            echo "No changes to data/projects.yaml"
          fi
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Upload projects.yaml workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: projects-yaml
          path: data/projects.yaml
      - name: Attach data/projects.yaml to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" data/projects.yaml --clobber

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
